# ============================================================================
# Blueprint de Render: base de datos PostgreSQL y backend del SGA (plan gratuito).
# Render crea la base y le pasa al servicio sus datos de conexión. Los secretos se
# generan en Render o se escriben en su panel; nunca se versionan aquí.
# El frontend se despliega en Vercel (directorio raíz sga/frontend) con VITE_API_URL apuntando a este servicio.
# ============================================================================
databases:
  - name: sga-bd
    plan: free
    databaseName: sga
    user: sga

services:
  - type: web
    name: sga-api
    runtime: docker
    plan: free
    # El proyecto vive en la carpeta sga/ del repositorio.
    dockerContext: ./sga
    dockerfilePath: ./sga/Dockerfile
    healthCheckPath: /api/alojamiento
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: postgres
      - key: SGA_BD_HOST
        fromDatabase:
          name: sga-bd
          property: host
      - key: SGA_BD_PUERTO
        fromDatabase:
          name: sga-bd
          property: port
      - key: SGA_BD_NOMBRE
        fromDatabase:
          name: sga-bd
          property: database
      - key: SGA_BD_USUARIO
        fromDatabase:
          name: sga-bd
          property: user
      - key: SGA_BD_CLAVE
        fromDatabase:
          name: sga-bd
          property: password
      - key: SGA_JWT_SECRETO
        generateValue: true
      # Dominio del frontend en Vercel, por ejemplo https://sga-aldea-bahareque.vercel.app
      - key: SGA_CORS_ORIGENES
        sync: false
      - key: SGA_CONTRASENA_DEMO
        sync: false
      - key: SGA_CREDENCIAL_CANAL_DEMO
        sync: false
      # Sugerencia de gravedad con un modelo de OpenRouter (API compatible con /chat/completions).
      # SGA_IA_MODELO es el identificador del modelo, por ejemplo uno gratuito terminado en :free.
      - key: SGA_IA_PROVEEDOR
        value: openai
      - key: SGA_IA_URL
        value: https://openrouter.ai/api/v1
      - key: SGA_IA_MODELO
        sync: false
      - key: SGA_IA_CLAVE
        sync: false
      - key: SGA_IA_TIMEOUT_MS
        value: "15000"
      # Correos por SMTP (Brevo). El plan gratuito de Render bloquea los puertos 25, 465 y 587,
      # por eso se usa el 2525. El remitente debe estar verificado en Brevo.
      - key: SGA_NOTIFICACIONES
        value: smtp
      - key: SGA_SMTP_HOST
        value: smtp-relay.brevo.com
      - key: SGA_SMTP_PUERTO
        value: "2525"
      - key: SGA_SMTP_USUARIO
        sync: false
      - key: SGA_SMTP_CLAVE
        sync: false
      - key: SGA_SMTP_REMITENTE
        sync: false
      # Imágenes subidas en Cloudinary: el disco del plan gratuito de Render no es persistente.
      # CLOUDINARY_URL se copia del panel de Cloudinary (cloudinary://clave:secreto@nube).
      - key: SGA_IMAGENES
        value: cloudinary
      - key: CLOUDINARY_URL
        sync: false
