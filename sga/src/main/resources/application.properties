spring.application.name=sga

# --- Base de datos H2 en memoria ---
spring.datasource.url=jdbc:h2:mem:sgadb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# --- Consola web de H2 ---
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- JPA ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# --- Servidor ---
server.port=9090

# --- JSON ---
# Jackson 3 rechaza por defecto los campos primitivos ausentes; en la API se toman como 0 o false.
spring.jackson.deserialization.fail-on-null-for-primitives=false

# --- SGA ---
# Zona horaria del alojamiento: todas las fechas del negocio se interpretan en ella.
sga.zona-horaria=America/Bogota
# Clave de firma de los JWT (mínimo 32 caracteres). Nunca se versiona: se toma de la
# variable de entorno SGA_JWT_SECRETO. Si falta, se genera una clave temporal al arrancar.
sga.jwt.secreto=${SGA_JWT_SECRETO:}
sga.jwt.minutos-expiracion=480
sga.jwt.emisor=sga-aldea-bahareque
# Datos de demostración (Ficha del Alojamiento, usuarios por rol y reservas en todos los estados).
sga.datos-prueba.habilitados=true
sga.datos-prueba.contrasena=${SGA_CONTRASENA_DEMO:}
# RN-21: cada cuánto se cancelan automáticamente las reservas pendientes vencidas.
sga.reservas.intervalo-vencimiento-ms=60000
sga.datos-prueba.credencial-canal=${SGA_CREDENCIAL_CANAL_DEMO:}

# --- Integraciones (Corte 4) ---
# Toda integración tiene una alternativa local que funciona sin internet ni credenciales (I-02),
# un tiempo de espera máximo (I-03) y credenciales tomadas de variables de entorno (I-06).

# Notificaciones: memoria (log) | smtp
sga.notificaciones.proveedor=${SGA_NOTIFICACIONES:memoria}
sga.notificaciones.remitente=${SGA_SMTP_REMITENTE:}
sga.notificaciones.timeout-ms=10000
sga.notificaciones.smtp.host=${SGA_SMTP_HOST:}
sga.notificaciones.smtp.puerto=${SGA_SMTP_PUERTO:587}
sga.notificaciones.smtp.usuario=${SGA_SMTP_USUARIO:}
sga.notificaciones.smtp.clave=${SGA_SMTP_CLAVE:}
sga.notificaciones.smtp.starttls=true

# Modelo de IA (sugerencia de gravedad de novedades). Apagarlo es solo cambiar esta línea.
sga.ia.habilitada=${SGA_IA_HABILITADA:true}
# simulado (reglas locales) | openai (API compatible con /chat/completions: Ollama local, Groq, Gemini...)
sga.ia.proveedor=${SGA_IA_PROVEEDOR:simulado}
sga.ia.url=${SGA_IA_URL:http://localhost:11434/v1}
sga.ia.modelo=${SGA_IA_MODELO:llama3.2}
sga.ia.clave=${SGA_IA_CLAVE:}
sga.ia.timeout-ms=5000

# Imágenes: local (carpeta del servidor) | cloudinary
sga.imagenes.proveedor=${SGA_IMAGENES:local}
sga.imagenes.directorio=${SGA_IMAGENES_DIRECTORIO:./datos/imagenes}
sga.imagenes.timeout-ms=15000
sga.imagenes.cloudinary.nube=${SGA_CLOUDINARY_NUBE:}
sga.imagenes.cloudinary.clave-api=${SGA_CLOUDINARY_CLAVE:}
sga.imagenes.cloudinary.secreto-api=${SGA_CLOUDINARY_SECRETO:}
sga.imagenes.cloudinary.carpeta=aldea-bahareque
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Recordatorios automáticos: todos los días a las 8:00 (hora de Colombia).
sga.recordatorios.cron=0 0 8 * * *

# Frontend compilado servido por este mismo servidor (solo en el despliegue).
sga.frontend.directorio=${SGA_FRONTEND_DIRECTORIO:}
