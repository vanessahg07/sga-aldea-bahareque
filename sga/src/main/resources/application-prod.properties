# Perfil de despliegue: H2 en modo archivo. Solo cambia la configuración del adaptador de
# persistencia; el dominio y los casos de uso son exactamente los mismos.
spring.datasource.url=jdbc:h2:file:${SGA_DATOS:./datos}/sga;AUTO_SERVER=FALSE
spring.datasource.username=${SGA_BD_USUARIO:sa}
spring.datasource.password=${SGA_BD_CLAVE:}
spring.h2.console.enabled=false
server.port=${PORT:8080}
# Los datos de demostración solo se cargan si la base está vacía.
sga.datos-prueba.habilitados=${SGA_DATOS_PRUEBA:true}
sga.imagenes.directorio=${SGA_IMAGENES_DIRECTORIO:${SGA_DATOS:./datos}/imagenes}
