# ============================================================================
# Perfil de despliegue con H2 en archivo (un solo servidor con disco persistente).
# Se activa con SPRING_PROFILES_ACTIVE=prod. Solo cambia el adaptador de persistencia.
# ============================================================================

spring.datasource.url=jdbc:h2:file:${SGA_DATOS:./datos}/sga;AUTO_SERVER=FALSE
spring.datasource.username=${SGA_BD_USUARIO:sa}
spring.datasource.password=${SGA_BD_CLAVE:}

# La consola de H2 no se expone fuera del desarrollo.
spring.h2.console.enabled=false

server.port=${PORT:8080}
sga.imagenes.directorio=${SGA_IMAGENES_DIRECTORIO:${SGA_DATOS:./datos}/imagenes}

# Sin clave del JWT la aplicación no arranca.
sga.jwt.secreto-obligatorio=true
