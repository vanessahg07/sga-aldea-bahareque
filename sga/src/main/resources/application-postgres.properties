# Perfil de despliegue con PostgreSQL gestionado (por ejemplo Neon o Supabase, nivel gratuito).
# Se activa con SPRING_PROFILES_ACTIVE=postgres. Igual que el perfil prod, solo cambia el adaptador.
spring.datasource.url=${SGA_BD_URL}
spring.datasource.username=${SGA_BD_USUARIO}
spring.datasource.password=${SGA_BD_CLAVE}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.h2.console.enabled=false
server.port=${PORT:8080}
sga.datos-prueba.habilitados=${SGA_DATOS_PRUEBA:true}
