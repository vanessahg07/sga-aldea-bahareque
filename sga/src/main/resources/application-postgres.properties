# ============================================================================
# Perfil de despliegue con PostgreSQL (Render). Se activa con SPRING_PROFILES_ACTIVE=postgres.
# Solo cambia el adaptador de persistencia: el dominio y los casos de uso son los mismos.
# ============================================================================

# Render entrega los datos de la base por separado (host, puerto, nombre, usuario y clave).
# También se puede indicar la URL JDBC completa en SGA_BD_URL (por ejemplo, para Neon o Supabase).
spring.datasource.url=${SGA_BD_URL:jdbc:postgresql://${SGA_BD_HOST}:${SGA_BD_PUERTO:5432}/${SGA_BD_NOMBRE}}
spring.datasource.username=${SGA_BD_USUARIO}
spring.datasource.password=${SGA_BD_CLAVE}
spring.datasource.driver-class-name=org.postgresql.Driver
# El plan gratuito de Render admite pocas conexiones simultáneas.
spring.datasource.hikari.maximum-pool-size=5

# La consola de H2 no existe fuera del desarrollo.
spring.h2.console.enabled=false

# Render asigna el puerto en la variable PORT.
server.port=${PORT:8080}

# Sin clave del JWT la aplicación no arranca.
sga.jwt.secreto-obligatorio=true
